name: Foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This lightweight job runs on every event to calculate changed paths.
  # Platform and integration jobs are conditionally executed, and the
  # ci-pass job aggregates their results for branch protection.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      headless: ${{ steps.filter.outputs.headless }}
      controller: ${{ steps.filter.outputs.controller }}
      windows: ${{ steps.filter.outputs.windows }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rust=false
          headless=false
          controller=false
          windows=false
          compose=false

          run_all=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            run_all=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1 || ! git rev-parse --verify "$HEAD_SHA" >/dev/null 2>&1; then
              run_all=true
            else
              mapfile -d '' changed < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")
            fi
          else
            if ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1 || ! git rev-parse --verify "$HEAD_SHA" >/dev/null 2>&1; then
              run_all=true
            else
              mapfile -d '' changed < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
            fi
          fi

          if [[ "$run_all" == "true" ]]; then
            rust=true
            headless=true
            controller=true
            windows=true
            compose=true
          else
            for path in "${changed[@]}"; do
              if [[ "$path" == *.rs || "$path" == *.proto ]]; then
                rust=true
              fi

              if [[ "$path" == Cargo.toml || "$path" == Cargo.lock || "$path" == rust-toolchain.toml || "$path" == .github/workflows/foundation.yml || "$path" == .github/actions/* ]]; then
                rust=true
                headless=true
                controller=true
                windows=true
                compose=true
              fi

              if [[ "$path" =~ ^crates/rustctrl_(agent|server|controller|core|network|protocol|android|tasks|media|windows_native)/ ]]; then
                headless=true
              fi

              if [[ "$path" =~ ^crates/rustctrl_(controller|core|network|protocol)/ ]]; then
                controller=true
              fi

              if [[ "$path" =~ ^crates/rustctrl_(agent|server|controller|windows_native|core|network|protocol)/ ]]; then
                windows=true
              fi

              if [[ "$path" =~ ^crates/rustctrl_(server|agent|core|network|protocol)/ || "$path" =~ ^config/server.*\.toml$ || "$path" == .env.example || "$path" == compose.yaml || "$path" == .dockerignore || "$path" == packaging/server/Dockerfile || "$path" == scripts/smoke-compose.sh ]]; then
                compose=true
              fi
            done
          fi

          {
            echo "rust=$rust"
            echo "headless=$headless"
            echo "controller=$controller"
            echo "windows=$windows"
            echo "compose=$compose"
          } >> "$GITHUB_OUTPUT"

  format:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - run: cargo fmt --all --check

  headless:
    needs: changes
    if: needs.changes.outputs.headless == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup show
      - run: cargo clippy --locked --workspace --exclude rustctrl_controller --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude rustctrl_controller
      - run: cargo build --locked -p rustctrl_controller --no-default-features

  almalinux-controller:
    needs: changes
    if: needs.changes.outputs.controller == 'true'
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - run: >-
          dnf install -y git curl-minimal tar gcc gcc-c++ pkgconf-pkg-config fontconfig-devel
          freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "almalinux-controller"
      - name: Build and lint GPUI Controller
        run: |
          cargo clippy --locked -p rustctrl_controller --all-targets -- -D warnings
          cargo build --locked -p rustctrl_controller

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup show
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p rustctrl_controller -p rustctrl_agent -p rustctrl_server
      - name: Check service start and stop
        shell: pwsh
        run: |
          ./target/debug/rustctrl-server.exe init-pki --output .local/pki
          if ($LASTEXITCODE -ne 0) { throw "PKI initialization failed" }
          $exe = (Resolve-Path ./target/debug/rustctrl-agent.exe).Path
          $config = (Resolve-Path ./.local/pki/clients/agent/config.toml).Path
          $binaryPath = "`"$exe`" service --config `"$config`""
          New-Service -Name RustCtrlAgent -BinaryPathName $binaryPath -StartupType Manual
          try {
            Start-Service RustCtrlAgent
            (Get-Service RustCtrlAgent).WaitForStatus('Running', [TimeSpan]::FromSeconds(20))
            Stop-Service RustCtrlAgent
            (Get-Service RustCtrlAgent).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(20))
          } finally {
            Stop-Service RustCtrlAgent -ErrorAction SilentlyContinue
            sc.exe delete RustCtrlAgent
          }
          # Check rustctrl-agent service subcommands
          ./target/debug/rustctrl-agent.exe install --config $config
          try {
            ./target/debug/rustctrl-agent.exe status
            ./target/debug/rustctrl-agent.exe start
            (Get-Service RustCtrlAgent).WaitForStatus('Running', [TimeSpan]::FromSeconds(20))
            ./target/debug/rustctrl-agent.exe status
            ./target/debug/rustctrl-agent.exe stop
            (Get-Service RustCtrlAgent).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(20))
          } finally {
            ./target/debug/rustctrl-agent.exe uninstall
          }

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - run: rustup show
      - name: Cache host Agent dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache Server build mounts
        id: server-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .local/buildkit-cargo
          key: server-build-mounts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/server/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            server-build-mounts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/server/Dockerfile') }}-
      # Layer caches do not preserve RUN --mount=type=cache contents. Extract
      # these mounts before actions/cache saves them in its post step.
      - name: Restore and extract Server build mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          dockerfile: packaging/server/Dockerfile
          cache-dir: .local/buildkit-cargo
          scratch-dir: .local/buildkit-scratch
          skip-extraction: ${{ steps.server-cache.outputs.cache-hit == 'true' }}
      - name: Build Server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: packaging/server/Dockerfile
          load: true
          tags: rustctrl-server:local
          cache-from: type=gha,scope=rustctrl-server
          cache-to: type=gha,scope=rustctrl-server,mode=max
      - name: Check Compose startup with the built image
        env:
          RUSTCTRL_SKIP_IMAGE_BUILD: "1"
        run: scripts/smoke-compose.sh

  ci-pass:
    needs: [changes, format, headless, almalinux-controller, windows, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gated checks passed or were legitimately skipped
        run: |
          statuses=(
            "${{ needs.changes.result }}"
            "${{ needs.format.result }}"
            "${{ needs.headless.result }}"
            "${{ needs.almalinux-controller.result }}"
            "${{ needs.windows.result }}"
            "${{ needs.compose.result }}"
          )
          for status in "${statuses[@]}"; do
            if [[ "$status" == "failure" || "$status" == "cancelled" ]]; then
              echo "A required job failed or was cancelled (status: $status)"
              exit 1
            fi
          done
          echo "All gated jobs succeeded or were legitimately skipped."
