syntax = "proto3";
package rustctrl.auth.v1;

service StaffAuth {
  rpc Login(LoginRequest) returns (LoginReply);
  rpc ReplaceTemporaryPassword(ReplaceTemporaryPasswordRequest) returns (ReplaceTemporaryPasswordReply);
  rpc ChangeOwnPassword(ChangeOwnPasswordRequest) returns (ChangeOwnPasswordReply);
  rpc ResetStaffPassword(ResetStaffPasswordRequest) returns (ResetStaffPasswordReply);
  rpc DeactivateStaffAccount(DeactivateStaffAccountRequest) returns (DeactivateStaffAccountReply);
  rpc Logout(LogoutRequest) returns (LogoutReply);
  rpc GetStaffStatus(StaffStatusRequest) returns (StaffStatusReply);
  rpc ListFleetDevices(ListFleetDevicesRequest) returns (ListFleetDevicesReply);
  rpc UpdateFleetDevice(UpdateFleetDeviceRequest) returns (UpdateFleetDeviceReply);
  rpc BlockDevice(BlockDeviceRequest) returns (BlockDeviceReply);
  rpc UnblockDevice(UnblockDeviceRequest) returns (UnblockDeviceReply);
  rpc CreateTarget(CreateTargetRequest) returns (CreateTargetReply);
  rpc UpdateTarget(UpdateTargetRequest) returns (UpdateTargetReply);
  rpc RemoveTarget(RemoveTargetRequest) returns (RemoveTargetReply);
  rpc ListStaffAccounts(ListStaffAccountsRequest) returns (ListStaffAccountsReply);
  rpc CreateStaffAccount(CreateStaffAccountRequest) returns (CreateStaffAccountReply);
  rpc ChangeStaffRole(ChangeStaffRoleRequest) returns (ChangeStaffRoleReply);
}

message LoginRequest {
  string username = 1;
  string password = 2;
  bool remember = 3;
}

message LoginReply {
  string session_token = 1;
  string username = 2;
  string role = 3;
  bool must_change_password = 4;
  int64 server_time_unix_ms = 5;
}

message ReplaceTemporaryPasswordRequest {
  string new_password = 1;
}

message ReplaceTemporaryPasswordReply {
  bool success = 1;
}

message ChangeOwnPasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangeOwnPasswordReply {
  bool success = 1;
}

message ResetStaffPasswordRequest {
  string username = 1;
  string temporary_password = 2;
}

message ResetStaffPasswordReply {
  StaffAccountEntry account = 1;
}

message DeactivateStaffAccountRequest {
  string username = 1;
}

message DeactivateStaffAccountReply {
  StaffAccountEntry account = 1;
}

message LogoutRequest {}

message LogoutReply {
  bool success = 1;
}

message StaffStatusRequest {}

message StaffStatusReply {
  string username = 1;
  string role = 2;
  bool authenticated = 3;
  uint64 registered_devices = 4;
  string server_version = 5;
}

message ListFleetDevicesRequest {}

message FleetDeviceEntry {
  string device_id = 1;
  string display_name = 2;
  string device_type = 3;
  string last_address = 4;
  bool online = 5;
  int64 last_seen_unix_ms = 6;
  optional string location = 7;
  optional string configured_address = 8;
  string status = 9;
  bool blocked = 10;
}

message ListFleetDevicesReply {
  repeated FleetDeviceEntry devices = 1;
}

message UpdateFleetDeviceRequest {
  string device_id = 1;
  string display_name = 2;
  optional string location = 3;
}

message UpdateFleetDeviceReply {
  FleetDeviceEntry device = 1;
}

message BlockDeviceRequest {
  string device_id = 1;
}

message BlockDeviceReply {
  FleetDeviceEntry device = 1;
}

message UnblockDeviceRequest {
  string device_id = 1;
}

message UnblockDeviceReply {
  FleetDeviceEntry device = 1;
}

message CreateTargetRequest {
  string display_name = 1;
  string address = 2;
  optional string location = 3;
  optional string target_type = 4;
}

message CreateTargetReply {
  FleetDeviceEntry target = 1;
}

message UpdateTargetRequest {
  string target_id = 1;
  string display_name = 2;
  string address = 3;
  optional string location = 4;
}

message UpdateTargetReply {
  FleetDeviceEntry target = 1;
}

message RemoveTargetRequest {
  string target_id = 1;
}

message RemoveTargetReply {
  bool success = 1;
  string target_id = 2;
}

message StaffAccountEntry {
  string username = 1;
  string role = 2;
  bool must_change_password = 3;
  int64 created_at_unix_ms = 4;
  int64 updated_at_unix_ms = 5;
  bool active = 6;
}

message ListStaffAccountsRequest {}

message ListStaffAccountsReply {
  repeated StaffAccountEntry accounts = 1;
}

message CreateStaffAccountRequest {
  string username = 1;
  string role = 2;
  string temporary_password = 3;
}

message CreateStaffAccountReply {
  StaffAccountEntry account = 1;
}

message ChangeStaffRoleRequest {
  string username = 1;
  string new_role = 2;
}

message ChangeStaffRoleReply {
  string username = 1;
  string role = 2;
  int64 updated_at_unix_ms = 3;
}

